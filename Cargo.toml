[package]
name = "sandookoo"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
iced = { version = "0.14.0", features = ["tokio"] }
iced_futures = { version = "0.14.0", features = ["tokio"] }
sea-orm = { version = "2.0.2", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
