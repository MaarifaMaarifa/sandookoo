[package]
name = "sandookoo"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
iced = { version = "0.14.0", features = ["tokio", "highlighter"] }
iced_futures = { version = "0.14.0", features = ["tokio"] }
keyring = "4.2.0"
sea-orm = { version = "2.0.2", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
